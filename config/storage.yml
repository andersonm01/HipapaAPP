test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

# Backblaze B2 (API compatible con S3) — usado en producción. El disco local
# del contenedor en Railway no es persistente: se pierde en cada deploy, por
# eso las imágenes subidas (logo, foto de portada, fotos de producto) se
# guardan acá en vez de en :local. Credenciales por variables de entorno
# (configurar en Railway → Variables): B2_KEY_ID, B2_APPLICATION_KEY,
# B2_BUCKET, B2_ENDPOINT (https://s3.<region>.backblazeb2.com). B2_REGION
# es opcional: si no se define, se deduce del propio B2_ENDPOINT (la
# región va en medio de esa URL), para que un solo dato mal cargado no
# tumbe el arranque de la app.
backblaze_b2:
  service: S3
  access_key_id: <%= ENV["B2_KEY_ID"] %>
  secret_access_key: <%= ENV["B2_APPLICATION_KEY"] %>
  region: <%= ENV["B2_REGION"].presence || ENV["B2_ENDPOINT"].to_s[/s3\.([a-z0-9-]+)\.backblazeb2\.com/i, 1] %>
  bucket: <%= ENV["B2_BUCKET"] %>
  endpoint: <%= ENV["B2_ENDPOINT"] %>
  force_path_style: true

# Use bin/rails credentials:edit to set the AWS secrets (as aws:access_key_id|secret_access_key)
# amazon:
#   service: S3
#   access_key_id: <%= Rails.application.credentials.dig(:aws, :access_key_id) %>
#   secret_access_key: <%= Rails.application.credentials.dig(:aws, :secret_access_key) %>
#   region: us-east-1
#   bucket: your_own_bucket-<%= Rails.env %>

# Remember not to checkin your GCS keyfile to a repository
# google:
#   service: GCS
#   project: your_project
#   credentials: <%= Rails.root.join("path/to/gcs.keyfile") %>
#   bucket: your_own_bucket-<%= Rails.env %>

# Use bin/rails credentials:edit to set the Azure Storage secret (as azure_storage:storage_access_key)
# microsoft:
#   service: AzureStorage
#   storage_account_name: your_account_name
#   storage_access_key: <%= Rails.application.credentials.dig(:azure_storage, :storage_access_key) %>
#   container: your_container_name-<%= Rails.env %>

