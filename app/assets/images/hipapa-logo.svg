<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Hi Papa">
  <title>Hi Papa</title>
  <defs>
    <linearGradient id="hp-papa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE08A"/>
      <stop offset=".45" stop-color="#F9C02E"/>
      <stop offset="1" stop-color="#E09400"/>
    </linearGradient>
    <linearGradient id="hp-caja" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#EF4650"/>
      <stop offset=".55" stop-color="#E0323C"/>
      <stop offset="1" stop-color="#B91E29"/>
    </linearGradient>
  </defs>

  <!-- Papas: asoman por detrás de la caja, con inclinaciones distintas -->
  <g fill="url(#hp-papa)">
    <rect x="16.5" y="6.6" width="5.4" height="23.4" rx="2.6" transform="rotate(-22 19.2 18.3)"/>
    <rect x="24.6" y="2.6" width="5.4" height="27.4" rx="2.6" transform="rotate(-8 27.3 16.3)"/>
    <rect x="33.2" y="2.2" width="5.4" height="27.8" rx="2.6" transform="rotate(7 35.9 16.1)"/>
    <rect x="41.6" y="6.2" width="5.4" height="23.8" rx="2.6" transform="rotate(21 44.3 18.1)"/>
  </g>

  <!-- Caja: trapecio que se angosta hacia abajo -->
  <path fill="url(#hp-caja)"
        d="M15.8 26h32.4l-3.9 28.8a4 4 0 0 1-3.96 3.2H23.66a4 4 0 0 1-3.96-3.2z"/>

  <!-- Borde superior de la caja -->
  <rect x="13.2" y="22.3" width="37.6" height="7" rx="3.1" fill="#FFF3DF"/>

  <!-- Sombra interna suave sobre el lado derecho, para dar volumen -->
  <path fill="#000" opacity=".12"
        d="M40.9 29.3h7.1l-3.7 25.5a4 4 0 0 1-3.96 3.2h-4.1z"/>
</svg>
